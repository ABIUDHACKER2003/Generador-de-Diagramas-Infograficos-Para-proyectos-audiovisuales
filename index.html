<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ---- almacenamiento: localStorage si existe (uso local), si no, memoria ---- */
const __mem = {};
(function () {
  let ls = null;
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); ls = localStorage; } catch (e) {}
  window.storage = {
    get: async (k) => { try { const v = ls ? ls.getItem(k) : __mem[k]; return v != null ? { key: k, value: v } : null; } catch { const v = __mem[k]; return v != null ? { key: k, value: v } : null; } },
    set: async (k, v) => { try { ls ? ls.setItem(k, v) : (__mem[k] = v); } catch { __mem[k] = v; } return { key: k, value: v }; },
    delete: async (k) => { try { ls ? ls.removeItem(k) : (delete __mem[k]); } catch { delete __mem[k]; } return { key: k, deleted: true }; },
  };
})();

/* ---- iconos (lucide UMD) como componentes React ---- */
function LucideIcon({ name, size = 20, color = "currentColor", className, style, strokeWidth = 2 }) {
  const data = (window.lucide && window.lucide.icons && window.lucide.icons[name]) || [];
  const kids = data.map((c, i) => React.createElement(c[0], Object.assign({ key: i }, c[1])));
  return React.createElement("svg", {
    xmlns: "http://www.w3.org/2000/svg", width: size, height: size, viewBox: "0 0 24 24",
    fill: "none", stroke: color, strokeWidth, strokeLinecap: "round", strokeLinejoin: "round",
    className, style,
  }, kids);
}
const mk = (name) => (props) => React.createElement(LucideIcon, Object.assign({ name }, props));
const Camera=mk("Camera"), Monitor=mk("Monitor"), Tv=mk("Tv"), Play=mk("Play"), User=mk("User"),
  Users=mk("Users"), Headphones=mk("Headphones"), SlidersHorizontal=mk("SlidersHorizontal"),
  Volume2=mk("Volume2"), Mic=mk("Mic"), Lightbulb=mk("Lightbulb"), Megaphone=mk("Megaphone"),
  Clapperboard=mk("Clapperboard"), Printer=mk("Printer"), Plus=mk("Plus"), Trash2=mk("Trash2"),
  ChevronUp=mk("ChevronUp"), ChevronDown=mk("ChevronDown"), Save=mk("Save"), FolderOpen=mk("FolderOpen"),
  FilePlus=mk("FilePlus"), Eye=mk("Eye"), Pencil=mk("Pencil"), X=mk("X"), ArrowRight=mk("ArrowRight"),
  Download=mk("Download"), Upload=mk("Upload"), Link2=mk("Link2"), Check=mk("Check"), Share2=mk("Share2");

/* ----------------------------- Tokens / utilidades ----------------------------- */
const NAVY = "#16365F";
const INK = "#15233D";
const PREVIEW_COLOR = "#7C3AED";
const AIR_COLOR = "#D92B2B";
const PALETTE = ["#1D6FD1", "#1FA14E", "#F07F13", "#8B5CF6", "#E0312F", "#0E9F9E", "#D1268F", "#4F46E5"];

const PLANOS = ["Plano General","Plano Medio","Plano Medio Izquierdo","Plano Medio Derecho","Plano Americano","Primer Plano","Plano Detalle","Two Shot","Over the Shoulder","Plano Cenital","Plano Contrapicado"];

const ICONS = { director: Headphones, switcher: SlidersHorizontal, audio: Volume2, graficos: Monitor, playback: Play, conductor: Mic, floor: Clapperboard, luces: Lightbulb, productor: Users, script: Pencil, custom: User };

const CATALOGO_ROLES = [
  { rol: "Director de cámaras", icon: "director" },
  { rol: "Operador de switcher", icon: "switcher" },
  { rol: "Operador de audio", icon: "audio" },
  { rol: "Operador de gráficos", icon: "graficos" },
  { rol: "Operador de playback", icon: "playback" },
  { rol: "Conductor(a)", icon: "conductor" },
  { rol: "Floor manager", icon: "floor" },
  { rol: "Iluminador", icon: "luces" },
  { rol: "Productor", icon: "productor" },
  { rol: "Continuista / Script", icon: "script" },
];

const uid = () => Math.random().toString(36).slice(2, 9);
const fmt = (s) => { s = Math.max(0, Math.round(s || 0)); const m = Math.floor(s / 60), ss = s % 60; return `${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`; };
const parseDur = (t) => {
  if (t == null) return null; t = String(t).trim(); if (!t) return null;
  if (t.includes(":")) { const p = t.split(":").map((n) => parseInt(n, 10)); if (p.some(isNaN)) return null; return p.reduce((a, n) => a * 60 + n, 0); }
  const n = parseInt(t, 10); return isNaN(n) ? null : n;
};
const textOn = (hex) => { try { const h = hex.replace("#",""); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return 0.299*r+0.587*g+0.114*b>165?"#1A2433":"#FFFFFF"; } catch { return "#FFFFFF"; } };
const trunc = (s, n) => (s && s.length > n ? s.slice(0, n - 1) + "…" : s || "");

/* ----------------------------- Datos de ejemplo ----------------------------- */
const DEMO = () => ({

const BLANCO = () => ({

/* ----------------------------- Cálculos ----------------------------- */
function computeFuentes(cfg) {
  const cams = cfg.camaras.map((c, i) => ({ id: c.id, tipo: "cam", num: i + 1, nombre: c.nombre || `CAM ${i + 1}`, plano: c.plano || "", color: c.color, esCorte: false }));
  const extras = cfg.extras.map((x) => ({ id: x.id, tipo: "extra", nombre: x.nombre || "FUENTE", color: x.color, esCorte: !!x.esCorte }));
  return [...cams, ...extras];
}
function computeRows(cfg) { let t = 0; return cfg.escaleta.map((s, i) => { const tin = t; t += s.dur || 0; return { ...s, idx: i + 1, tin, tout: t }; }); }
function computeBloques(rows, byId) {
  const g = [];
  rows.forEach((r) => { const f = byId[r.fuente]; const corte = !!(f && f.esCorte); const last = g[g.length - 1]; if (last && last.corte === corte) last.dur += r.dur || 0; else g.push({ corte, dur: r.dur || 0 }); });
  let b = 0, c = 0; return g.map((x) => ({ ...x, label: x.corte ? `CORTE ${++c}` : `BLOQUE ${++b}` }));
}

/* ----------------------------- Piezas ----------------------------- */
function Box({ title, children, style }) {
  return (
    <div className="rounded-xl border-2 bg-white" style={{ borderColor: NAVY, ...style }}>
      <div className="cond text-center text-white font-bold uppercase" style={{ background: NAVY, borderRadius: "10px 10px 0 0", padding: "4px 10px", fontSize: 16, letterSpacing: 1 }}>{title}</div>
      <div className="p-3">{children}</div>
    </div>
  );
}

function Estudio({ cfg, fuentes }) {
  const cams = fuentes.filter((f) => f.tipo === "cam");
  const N = cams.length, stagger = N > 4, H = stagger ? 530 : 480, cx = 490, targetY = 250;
  const pos = cams.map((c, i) => {
    const t = N === 1 ? 0 : -1 + (2 * i) / (N - 1);
    const a = (t * 62 * Math.PI) / 180;
    const x = cx + Math.sin(a) * 360, y = 312 + Math.cos(a) * 72;
    const rot = (Math.atan2(targetY - y, cx - x) * 180) / Math.PI;
    const ly = stagger && i % 2 === 1 ? 80 : 38;
    return { c, x, y, rot, ly };
  });
  const lw = N > 5 ? 124 : 156;
  return (
    <svg viewBox={`0 0 980 ${H}`} className="w-full" style={{ display: "block" }}>
      <rect x="20" y="248" width="940" height={H - 262} rx="10" fill="#E7EBF0" />
      <rect x="20" y="248" width="940" height="8" fill="#CFD6DE" />
      <rect x="60" y="30" width="860" height="222" rx="10" fill={NAVY} />
      <rect x="78" y="46" width="120" height="190" rx="6" fill="#1D4577" />
      <rect x="782" y="46" width="120" height="190" rx="6" fill="#1D4577" />
      <rect x="215" y="46" width="550" height="150" rx="8" fill="#0E2748" stroke="#3A6EA5" strokeWidth="2" />
      <foreignObject x="228" y="56" width="524" height="130">
        <div style={{ width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", textAlign: "center", color: "#FFFFFF", fontFamily: "'Barlow Condensed', Arial, sans-serif", fontWeight: 700, fontSize: 26, lineHeight: 1.15, textTransform: "uppercase", letterSpacing: 0.5, padding: "0 8px" }}>{cfg.pantalla}</div>
      </foreignObject>
      {[140, 330, 650, 840].map((x) => (
        <g key={x}>
          <line x1={x} y1="12" x2={x} y2="30" stroke="#0B1C33" strokeWidth="4" />
          <rect x={x - 16} y="28" width="32" height="14" rx="3" fill="#101D31" />
        </g>
      ))}
      <circle cx="490" cy="218" r="11" fill="#13315B" />
      <path d="M474 232 q16 -12 32 0 l4 22 h-40 z" fill="#1C3F6E" />
      <path d="M372 254 h236 l34 56 h-304 z" fill="#F3F5F7" stroke="#9AA7B5" strokeWidth="2" />
      <rect x="402" y="270" width="176" height="28" rx="5" fill={NAVY} />
      <foreignObject x="404" y="272" width="172" height="24">
        <div style={{ color: "#fff", textAlign: "center", fontSize: 12, fontWeight: 800, lineHeight: "24px", overflow: "hidden", whiteSpace: "nowrap", fontFamily: "'Barlow Condensed', Arial, sans-serif", letterSpacing: 1 }}>{cfg.mesa}</div>
      </foreignObject>
      {pos.map(({ c, x, y, rot, ly }) => (
        <g key={c.id} transform={`translate(${x} ${y})`}>
          <line x1="0" y1="6" x2="-13" y2="26" stroke="#222831" strokeWidth="3" />
          <line x1="0" y1="6" x2="13" y2="26" stroke="#222831" strokeWidth="3" />
          <line x1="0" y1="6" x2="0" y2="28" stroke="#222831" strokeWidth="3" />
          <g transform={`rotate(${rot})`}>
            <rect x="-16" y="-10" width="24" height="20" rx="3" fill="#1B1F26" />
            <rect x="8" y="-6" width="9" height="12" fill="#2C333D" />
            <circle cx="21" cy="0" r="6" fill="#0C0F14" stroke="#7D8794" strokeWidth="2" />
            <rect x="-14" y="-16" width="12" height="6" rx="1" fill="#2C333D" />
          </g>
          <circle cx="0" cy="-34" r="11" fill={c.color} stroke="#fff" strokeWidth="2" />
          <text x="0" y="-30" textAnchor="middle" fontSize="12" fontWeight="800" fill={textOn(c.color)}>{c.num}</text>
          <g transform={`translate(0 ${ly})`}>
            <rect x={-lw / 2} y="0" width={lw} height="36" rx="7" fill="#fff" stroke={c.color} strokeWidth="2.5" />
            <text x="0" y="15" textAnchor="middle" fontSize="13" fontWeight="800" fill={c.color}>{trunc(c.nombre, 16)}</text>
            <text x="0" y="29" textAnchor="middle" fontSize="10" fill="#3C4654">{trunc(c.plano, N > 5 ? 20 : 26)}</text>
          </g>
        </g>
      ))}
    </svg>
  );
}

function Nodo({ color, icon: Ic, t, s, badge }) {
  return (
    <div className="rounded-xl border-2 bg-white shrink-0" style={{ borderColor: color, width: 150 }}>
      <div className="cond text-center font-bold uppercase" style={{ color, fontSize: 15, letterSpacing: 0.5, padding: "3px 4px" }}>{t}</div>
      <div className="relative flex items-center justify-center" style={{ height: 56, background: "#0D1726", borderTop: `2px solid ${color}` }}>
        <Ic size={26} color="#CFE0F5" />
        {badge && (<span className="absolute font-bold text-white" style={{ bottom: 4, right: 6, background: AIR_COLOR, fontSize: 9, padding: "1px 6px", borderRadius: 4 }}>{badge}</span>)}
      </div>
      <div className="text-center text-slate-500" style={{ fontSize: 10, lineHeight: 1.2, padding: "4px 4px" }}>{s}</div>
    </div>
  );
}

function Flujo({ cfg, fuentes }) {
  const cams = fuentes.filter((f) => f.tipo === "cam");
  const corte = fuentes.find((f) => f.tipo === "extra" && f.esCorte) || { nombre: "COMERCIALES", color: "#F3C513" };
  return (
    <div className="overflow-x-auto">
      <div className="flex items-center gap-3" style={{ minWidth: 900, paddingBottom: 4 }}>
        <div className="flex flex-col gap-2">
          {cams.map((c) => (
            <div key={c.id} className="flex items-center gap-2">
              <span className="flex items-center justify-center rounded-full font-bold shrink-0" style={{ width: 22, height: 22, background: c.color, color: textOn(c.color), fontSize: 12 }}>{c.num}</span>
              <Camera size={18} color="#3C4654" />
              <div style={{ width: 172 }}>
                <div className="font-bold" style={{ fontSize: 12, color: INK, lineHeight: 1.1 }}>{c.nombre}</div>
                <div className="text-slate-500" style={{ fontSize: 10, lineHeight: 1.1, marginTop: 2 }}>{c.plano}</div>
              </div>
              <span style={{ width: 30, height: 3, background: c.color, borderRadius: 2 }} />
            </div>
          ))}
        </div>
        <ArrowRight size={22} color="#64748B" className="shrink-0" />
        <Nodo color="#27415F" icon={SlidersHorizontal} t="Switcher" s="Selección de cámaras y mezcla de señales" />
        {cfg.flujo.preview && (<><ArrowRight size={22} color="#64748B" className="shrink-0" /><Nodo color={PREVIEW_COLOR} icon={Monitor} t="Preview" s="Monitor de selección" /></>)}
        <ArrowRight size={22} color="#64748B" className="shrink-0" />
        <Nodo color={AIR_COLOR} icon={Tv} t="Al aire" s="Programa (en transmisión)" badge="ON AIR" />
        {cfg.flujo.playback && (<><span className="shrink-0" style={{ width: 34, borderTop: `3px dashed ${corte.color}` }} /><Nodo color={corte.color} icon={Megaphone} t={corte.nombre} s="Playback (spots / cortinillas)" /></>)}
      </div>
    </div>
  );
}

function MiniMonitor({ label, color, num, Ic, air }) {
  return (
    <div className="rounded-lg overflow-hidden border-2 bg-white" style={{ borderColor: air ? AIR_COLOR : "#22344E", width: 142 }}>
      <div className="flex items-center gap-1" style={{ padding: "2px 6px", background: "#F1F4F8" }}>
        {num != null ? (
          <span className="flex items-center justify-center rounded-full font-bold shrink-0" style={{ width: 16, height: 16, background: color, color: textOn(color), fontSize: 10 }}>{num}</span>
        ) : (<span className="rounded-full shrink-0" style={{ width: 10, height: 10, background: color }} />)}
        <span className="font-bold uppercase truncate" style={{ fontSize: 10, color: INK }}>{label}</span>
      </div>
      <div className="relative flex items-center justify-center" style={{ height: 70, background: "#0D1726" }}>
        <Ic size={24} color="#33476A" />
        {air && (<span className="absolute font-bold text-white" style={{ bottom: 4, background: AIR_COLOR, fontSize: 9, padding: "1px 8px", borderRadius: 4 }}>ON AIR</span>)}
      </div>
    </div>
  );
}

const tdC = { border: "1px solid #D5DDE7", padding: "2px 5px", fontSize: 10.5, textAlign: "center", color: "#26324A" };

function Escaleta({ rows, byId, total }) {
  return (
    <div>
      <table className="w-full" style={{ borderCollapse: "collapse" }}>
        <thead>
          <tr style={{ background: "#E9EDF3" }}>
            {["#","IN","OUT","DUR.","SEGMENTO","AL AIRE"].map((h) => (
              <th key={h} className="cond uppercase" style={{ border: "1px solid #C8D2DE", padding: "3px 5px", fontSize: 11.5, color: INK, letterSpacing: 0.5, textAlign: h === "SEGMENTO" ? "left" : "center" }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map((r, i) => {
            const f = byId[r.fuente];
            return (
              <tr key={r.id} style={{ background: i % 2 ? "#F7F9FB" : "#fff" }}>
                <td style={tdC}>{r.idx}</td>
                <td style={tdC}>{fmt(r.tin)}</td>
                <td style={tdC}>{fmt(r.tout)}</td>
                <td style={tdC}>{fmt(r.dur)}</td>
                <td style={{ ...tdC, textAlign: "left", fontWeight: 600, textTransform: "uppercase", fontSize: 10 }}>{r.segmento}</td>
                <td style={{ ...tdC, padding: "2px 4px" }}>
                  {f ? (<span className="font-bold uppercase" style={{ background: f.color, color: textOn(f.color), fontSize: 9.5, padding: "2px 7px", borderRadius: 5, whiteSpace: "nowrap" }}>{f.nombre}</span>) : <span style={{ color: "#94A3B8" }}>—</span>}
                </td>
              </tr>
            );
          })}
          {rows.length === 0 && (<tr><td colSpan="6" style={{ ...tdC, padding: 14, color: "#94A3B8" }}>Sin segmentos — agrégalos en el editor</td></tr>)}
        </tbody>
      </table>
      <div className="cond text-center font-bold uppercase" style={{ marginTop: 6, background: "#E9EDF3", border: "1px solid #C8D2DE", borderRadius: 6, padding: "3px", fontSize: 13, color: INK, letterSpacing: 1 }}>Duración total: {fmt(total)} min</div>
    </div>
  );
}

function Timeline({ rows, byId, total, bloques }) {
  const step = total <= 0 ? 60 : total <= 960 ? 60 : total <= 1980 ? 120 : total <= 3900 ? 300 : 600;
  const marks = []; for (let t = 0; t <= total; t += step) marks.push(t);
  if (total === 0) return <div className="text-center text-slate-400" style={{ fontSize: 12, padding: 12 }}>Agrega segmentos a la escaleta para generar la línea de tiempo</div>;
  return (
    <div>
      <div className="relative w-full" style={{ height: 16 }}>
        {marks.map((t) => (<span key={t} className="absolute font-semibold" style={{ left: `${(t / total) * 100}%`, transform: "translateX(-50%)", fontSize: 9, color: "#5B6B82" }}>{fmt(t)}</span>))}
      </div>
      <div className="flex w-full overflow-hidden rounded-md border-2" style={{ height: 34, borderColor: "#22344E" }}>
        {rows.map((r) => {
          const f = byId[r.fuente]; const w = (r.dur / total) * 100;
          return (
            <div key={r.id} title={`${r.segmento} · ${fmt(r.dur)}`} className="flex items-center justify-center" style={{ width: `${w}%`, background: f ? f.color : "#9AA7B5", borderRight: "1px solid rgba(255,255,255,.55)" }}>
              {w > 2.4 && (<span className="font-bold" style={{ color: textOn(f ? f.color : "#9AA7B5"), fontSize: 11 }}>{f ? (f.tipo === "cam" ? f.num : (f.nombre || "•").slice(0, 1)) : "?"}</span>)}
            </div>
          );
        })}
      </div>
      <div className="flex w-full" style={{ height: 18, marginTop: 2 }}>
        {bloques.map((b, i) => (
          <div key={i} className="cond flex items-center justify-center font-bold uppercase truncate" style={{ width: `${(b.dur / total) * 100}%`, fontSize: 10, letterSpacing: 0.5, color: b.corte ? "#8A6D00" : "#33445F", background: b.corte ? "#FBF3D2" : "transparent", borderRight: "1px dashed #9AA7B5", borderRadius: 3 }}>
            {(b.dur / total) * 100 > 5 ? b.label : ""}
          </div>
        ))}
      </div>
    </div>
  );
}

function Infografia({ cfg }) {
  const fuentes = useMemo(() => computeFuentes(cfg), [cfg]);
  const byId = useMemo(() => Object.fromEntries(fuentes.map((f) => [f.id, f])), [fuentes]);
  const rows = useMemo(() => computeRows(cfg), [cfg]);
  const total = rows.length ? rows[rows.length - 1].tout : 0;

    cfg.flujo.playback && corte && { label: corte.nombre, color: corte.color, Ic: Megaphone },

        <div className="flex-1 text-center">
          <h1 className="cond font-bold uppercase" style={{ color: NAVY, fontSize: 34, lineHeight: 1.05, letterSpacing: 1 }}>{cfg.titulo}</h1>
          <p className="font-semibold" style={{ color: "#33445F", fontSize: 14, marginTop: 2 }}>{cfg.subtitulo}</p>
        </div>
        <div className="flex flex-col items-center justify-center rounded-lg border-2" style={{ borderColor: NAVY, width: 170, padding: 6 }}>
          <span className="cond uppercase font-bold" style={{ fontSize: 12, color: "#5B6B82", letterSpacing: 1 }}>Duración</span>
          <span className="cond font-bold" style={{ fontSize: 26, color: NAVY, lineHeight: 1 }}>{fmt(total)}</span>
          <span style={{ fontSize: 10, color: "#5B6B82", marginTop: 2 }}>{new Date().toLocaleDateString()}</span>
        </div>
      </div>

      <div className="flex gap-3 items-start">
        <div className="flex flex-col gap-3" style={{ flex: 1, minWidth: 0 }}>
          <Box title="Set / Estudio"><Estudio cfg={cfg} fuentes={fuentes} /></Box>
          <Box title="Flujo de producción"><Flujo cfg={cfg} fuentes={fuentes} /></Box>
        </div>
        <div style={{ width: 392, flexShrink: 0 }}>
          <Box title={`Escaleta / Rundown — ${fmt(total)}`}><Escaleta rows={rows} byId={byId} total={total} /></Box>
        </div>
      </div>

      <div className="flex gap-3 items-stretch" style={{ marginTop: 12 }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <Box title={`Monitores en cabina (${mons.length} en total)`} style={{ height: "100%" }}>
            <div className="flex flex-wrap gap-2">{mons.map((m, i) => <MiniMonitor key={i} {...m} />)}</div>
          </Box>
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <Box title="Personal mínimo de operación" style={{ height: "100%" }}>
            <div className="flex flex-wrap gap-3">
              {cfg.personal.map((p) => {
                const Ic = ICONS[p.icon] || User;
                return (
                  <div key={p.id} className="flex flex-col items-center text-center" style={{ width: 92 }}>
                    <span className="flex items-center justify-center rounded-full" style={{ width: 42, height: 42, background: NAVY }}><Ic size={20} color="#fff" /></span>
                    <span className="font-bold uppercase" style={{ fontSize: 9.5, color: INK, marginTop: 4, lineHeight: 1.15 }}>{p.rol}</span>
                  </div>
                );
              })}
              {cfg.includeCamOps && cams.map((c) => (
                <div key={c.id} className="flex flex-col items-center text-center" style={{ width: 92 }}>
                  <span className="relative flex items-center justify-center rounded-full" style={{ width: 42, height: 42, background: "#22344E" }}>
                    <Camera size={20} color="#fff" />
                    <span className="absolute flex items-center justify-center rounded-full font-bold" style={{ top: -4, right: -4, width: 17, height: 17, background: c.color, color: textOn(c.color), fontSize: 10, border: "2px solid #fff" }}>{c.num}</span>
                  </span>
                  <span className="font-bold uppercase" style={{ fontSize: 9.5, color: INK, marginTop: 4, lineHeight: 1.15 }}>Cámara {c.num}</span>
                  <span style={{ fontSize: 8.5, color: "#5B6B82", lineHeight: 1.1 }}>{trunc(c.plano, 24)}</span>
                </div>
              ))}
            </div>
          </Box>
        </div>
      </div>

      <div style={{ marginTop: 12 }}>
        <Box title={`Línea de tiempo — vista general de cámaras (${fmt(total)})`}><Timeline rows={rows} byId={byId} total={total} bloques={bloques} /></Box>
      </div>

      <div className="flex flex-wrap items-center justify-center gap-x-5 gap-y-2 rounded-lg border" style={{ marginTop: 12, borderColor: "#C8D2DE", background: "#F4F7FA", padding: "7px 10px" }}>
        {cams.map((c) => (
          <span key={c.id} className="flex items-center gap-1.5">
            <span className="flex items-center justify-center rounded-full font-bold" style={{ width: 18, height: 18, background: c.color, color: textOn(c.color), fontSize: 10 }}>{c.num}</span>
            <b style={{ fontSize: 11, color: INK }}>{c.nombre}</b>
            <span style={{ fontSize: 10.5, color: "#5B6B82" }}>({c.plano})</span>
          </span>
        ))}
        {cfg.flujo.preview && (
          <span className="flex items-center gap-1.5">
            <span className="flex items-center justify-center rounded-full font-bold text-white" style={{ width: 18, height: 18, background: PREVIEW_COLOR, fontSize: 10 }}>P</span>
            <b style={{ fontSize: 11, color: INK }}>PREVIEW</b><span style={{ fontSize: 10.5, color: "#5B6B82" }}>(Selección)</span>
          </span>
        )}
        {cfg.extras.map((x) => (
          <span key={x.id} className="flex items-center gap-1.5">
            <span className="flex items-center justify-center rounded-full font-bold" style={{ width: 18, height: 18, background: x.color, color: textOn(x.color), fontSize: 10 }}>{(x.nombre || "•").slice(0, 1)}</span>
            <b style={{ fontSize: 11, color: INK }}>{x.nombre}</b>
          </span>
        ))}
        <span className="flex items-center gap-1.5">
          <span className="flex items-center justify-center rounded-full font-bold text-white" style={{ width: 18, height: 18, background: AIR_COLOR, fontSize: 10 }}>A</span>
          <b style={{ fontSize: 11, color: INK }}>AL AIRE</b><span style={{ fontSize: 10.5, color: "#5B6B82" }}>(Programa)</span>
        </span>
      </div>
    </div>
  );
}

/* ----------------------------- Editor ----------------------------- */
function Card({ title, children, open = true }) {
  return (
    <details open={open} className="rounded-xl border bg-white overflow-hidden" style={{ borderColor: "#C8D2DE" }}>
      <summary className="cond cursor-pointer select-none font-bold uppercase text-white" style={{ background: NAVY, padding: "7px 12px", fontSize: 15, letterSpacing: 1, listStyle: "none" }}>{title}</summary>
      <div className="p-3 flex flex-col gap-3">{children}</div>
    </details>
  );
}
const inp = "w-full rounded-md border px-2 py-1.5 text-sm";
const inpStyle = { borderColor: "#C8D2DE", color: INK };
const btn = "inline-flex items-center gap-1.5 rounded-md px-2.5 py-1.5 text-sm font-semibold";

function Swatches({ value, onChange }) {
  return (
    <div className="flex gap-1.5 flex-wrap">
      {PALETTE.map((c) => (<button key={c} onClick={() => onChange(c)} aria-label={c} className="rounded-full" style={{ width: 18, height: 18, background: c, outline: value === c ? `2px solid ${INK}` : "1px solid rgba(0,0,0,.15)", outlineOffset: 2 }} />))}
    </div>
  );
}

function Editor({ cfg, setCfg, proyectos, guardar, cargar, eliminar, exportar, importar, compartirEnlace }) {
  const [nombreProy, setNombreProy] = useState("");
  const [rolCustom, setRolCustom] = useState("");
  const fuentes = computeFuentes(cfg);
  const rows = computeRows(cfg);
  const total = rows.length ? rows[rows.length - 1].tout : 0;

  const up = (patch) => setCfg((c) => ({ ...c, ...patch }));
  const upCam = (id, patch) => setCfg((c) => ({ ...c, camaras: c.camaras.map((k) => (k.id === id ? { ...k, ...patch } : k)) }));
  const upExtra = (id, patch) => setCfg((c) => ({ ...c, extras: c.extras.map((k) => (k.id === id ? { ...k, ...patch } : k)) }));
  const upSeg = (id, patch) => setCfg((c) => ({ ...c, escaleta: c.escaleta.map((s) => (s.id === id ? { ...s, ...patch } : s)) }));

  const addCam = () => setCfg((c) => { if (c.camaras.length >= 8) return c; const n = c.camaras.length + 1; return { ...c, camaras: [...c.camaras, { id: uid(), nombre: `CAM ${n}`, plano: "Plano Medio", color: PALETTE[(n - 1) % 8] }] }; });
  const delCam = (id) => setCfg((c) => { if (c.camaras.length <= 1) return c; const rest = c.camaras.filter((k) => k.id !== id); const fallback = rest[0].id; return { ...c, camaras: rest, escaleta: c.escaleta.map((s) => (s.fuente === id ? { ...s, fuente: fallback } : s)) }; });
  const addExtra = () => setCfg((c) => ({ ...c, extras: [...c.extras, { id: uid(), nombre: "VTR", color: "#64748B", esCorte: false }] }));
  const delExtra = (id) => setCfg((c) => { const fallback = c.camaras[0]?.id; return { ...c, extras: c.extras.filter((x) => x.id !== id), escaleta: c.escaleta.map((s) => (s.fuente === id && fallback ? { ...s, fuente: fallback } : s)) }; });
  const addSeg = () => setCfg((c) => ({ ...c, escaleta: [...c.escaleta, { id: uid(), segmento: "Nuevo segmento", dur: 60, fuente: c.camaras[0]?.id || c.extras[0]?.id }] }));
  const delSeg = (id) => setCfg((c) => ({ ...c, escaleta: c.escaleta.filter((s) => s.id !== id) }));
  const move = (i, d) => setCfg((c) => { const e = [...c.escaleta]; const j = i + d; if (j < 0 || j >= e.length) return c; [e[i], e[j]] = [e[j], e[i]]; return { ...c, escaleta: e }; });
  const addRol = (rol, icon) => setCfg((c) => c.personal.some((p) => p.rol.toLowerCase() === rol.toLowerCase()) ? c : { ...c, personal: [...c.personal, { id: uid(), rol, icon }] });
  const delRol = (id) => setCfg((c) => ({ ...c, personal: c.personal.filter((p) => p.id !== id) }));

  return (
    <div className="mx-auto flex flex-col gap-3 px-3 py-4" style={{ maxWidth: 880 }}>
      <Card title="Proyectos" open={false}>
        <div className="flex flex-wrap gap-2">
          <button className={btn} style={{ background: "#E9EDF3", color: INK }} onClick={() => setCfg(BLANCO())}><FilePlus size={15} /> Nuevo (en blanco)</button>
          <button className={btn} style={{ background: "#E9EDF3", color: INK }} onClick={() => setCfg(DEMO())}><FolderOpen size={15} /> Cargar ejemplo UASLP</button>
        </div>
        <div className="flex gap-2">
          <input className={inp} style={inpStyle} placeholder="Nombre del proyecto…" value={nombreProy} onChange={(e) => setNombreProy(e.target.value)} />
          <button className={`${btn} shrink-0 text-white`} style={{ background: NAVY }} onClick={() => { if (nombreProy.trim()) { guardar(nombreProy.trim()); setNombreProy(""); } }}><Save size={15} /> Guardar</button>
        </div>
        {proyectos.length > 0 && (
          <div className="flex flex-col gap-1.5">
            {proyectos.map((p) => (
              <div key={p.id} className="flex items-center gap-2 rounded-md border px-2 py-1.5" style={{ borderColor: "#C8D2DE" }}>
                <span className="flex-1 text-sm font-semibold truncate" style={{ color: INK }}>{p.nombre}</span>
                <span className="text-xs text-slate-400">{new Date(p.fecha).toLocaleDateString()}</span>
                <button className={btn} style={{ background: "#E9EDF3", color: INK, padding: "3px 8px" }} onClick={() => cargar(p)}>Abrir</button>
                <button className="text-slate-400" onClick={() => eliminar(p)} aria-label="Eliminar"><Trash2 size={15} /></button>
              </div>
            ))}
          </div>
        )}
        <p className="text-xs text-slate-500">Los proyectos se guardan en este navegador y tu trabajo actual se autoguarda.</p>
        <div className="rounded-lg border" style={{ borderColor: "#C8D2DE", background: "#F4F7FA", padding: 10 }}>
          <p className="cond font-bold uppercase" style={{ fontSize: 13, color: NAVY, letterSpacing: 0.5, marginBottom: 6 }}>Compartir con tu comunidad</p>
          <div className="flex flex-wrap gap-2">
            <button className={`${btn} text-white`} style={{ background: NAVY }} onClick={compartirEnlace}><Link2 size={15} /> Copiar enlace</button>
            <button className={btn} style={{ background: "#E9EDF3", color: INK }} onClick={exportar}><Download size={15} /> Exportar archivo</button>
            <label className={`${btn} cursor-pointer`} style={{ background: "#E9EDF3", color: INK }}>
              <Upload size={15} /> Importar archivo
              <input type="file" accept=".json,application/json" className="hidden" onChange={(e) => { importar(e.target.files[0]); e.target.value = ""; }} />
            </label>
          </div>
          <p className="text-xs text-slate-500" style={{ marginTop: 6 }}>El enlace abre el proyecto ya cargado. El archivo <b>.json</b> sirve para que otra persona lo importe y siga editándolo.</p>
        </div>
      </Card>

      <Card title="Datos generales">
        <label className="text-xs font-bold uppercase text-slate-500">Título principal<input className={inp} style={inpStyle} value={cfg.titulo} onChange={(e) => up({ titulo: e.target.value })} /></label>
        <label className="text-xs font-bold uppercase text-slate-500">Subtítulo<input className={inp} style={inpStyle} value={cfg.subtitulo} onChange={(e) => up({ subtitulo: e.target.value })} /></label>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <label className="text-xs font-bold uppercase text-slate-500">Organización / logo<input className={inp} style={inpStyle} value={cfg.organizacion} onChange={(e) => up({ organizacion: e.target.value })} /></label>
          <label className="text-xs font-bold uppercase text-slate-500">Texto pantalla del set<input className={inp} style={inpStyle} value={cfg.pantalla} onChange={(e) => up({ pantalla: e.target.value })} /></label>
          <label className="text-xs font-bold uppercase text-slate-500">Texto de la mesa<input className={inp} style={inpStyle} value={cfg.mesa} onChange={(e) => up({ mesa: e.target.value })} /></label>
        </div>
      </Card>

      <Card title={`Cámaras y planos (${cfg.camaras.length})`}>
        <datalist id="planos">{PLANOS.map((p) => <option key={p} value={p} />)}</datalist>
        {cfg.camaras.map((c, i) => (
          <div key={c.id} className="rounded-lg border p-2 flex flex-col gap-2" style={{ borderColor: "#DDE4EC" }}>
            <div className="flex flex-wrap items-center gap-2">
              <span className="flex items-center justify-center rounded-full font-bold shrink-0" style={{ width: 24, height: 24, background: c.color, color: textOn(c.color), fontSize: 12 }}>{i + 1}</span>
              <input className={inp} style={{ ...inpStyle, width: 110, flex: "0 0 auto" }} value={c.nombre} onChange={(e) => upCam(c.id, { nombre: e.target.value })} />
              <input className={inp} style={{ ...inpStyle, flex: "1 1 160px" }} list="planos" placeholder="Tipo de plano…" value={c.plano} onChange={(e) => upCam(c.id, { plano: e.target.value })} />
              <button className="text-slate-400 shrink-0" onClick={() => delCam(c.id)} disabled={cfg.camaras.length <= 1} aria-label="Eliminar cámara"><Trash2 size={16} /></button>
            </div>
            <Swatches value={c.color} onChange={(col) => upCam(c.id, { color: col })} />
          </div>
        ))}
        <button className={`${btn} text-white self-start`} style={{ background: NAVY }} onClick={addCam} disabled={cfg.camaras.length >= 8}><Plus size={15} /> Agregar cámara {cfg.camaras.length >= 8 ? "(máx. 8)" : ""}</button>
      </Card>

      <Card title="Otras fuentes (comerciales, VTR, gráficos…)" open={false}>
        {cfg.extras.map((x) => (
          <div key={x.id} className="rounded-lg border p-2 flex flex-col gap-2" style={{ borderColor: "#DDE4EC" }}>
            <div className="flex flex-wrap items-center gap-2">
              <input className={inp} style={{ ...inpStyle, flex: "1 1 140px" }} value={x.nombre} onChange={(e) => upExtra(x.id, { nombre: e.target.value })} />
              <label className="flex items-center gap-1.5 text-xs font-semibold text-slate-600 shrink-0"><input type="checkbox" checked={!!x.esCorte} onChange={(e) => upExtra(x.id, { esCorte: e.target.checked })} /> Es corte comercial</label>
              <button className="text-slate-400 shrink-0" onClick={() => delExtra(x.id)} aria-label="Eliminar fuente"><Trash2 size={16} /></button>
            </div>
            <Swatches value={x.color} onChange={(col) => upExtra(x.id, { color: col })} />
          </div>
        ))}
        <button className={`${btn} self-start`} style={{ background: "#E9EDF3", color: INK }} onClick={addExtra}><Plus size={15} /> Agregar fuente</button>
      </Card>

      <Card title={`Escaleta / Rundown — total ${fmt(total)}`}>
        <p className="text-xs text-slate-500" style={{ marginTop: -6 }}>Duración en MM:SS (ej. 01:10). IN/OUT y la línea de tiempo se calculan solos.</p>
        {cfg.escaleta.map((s, i) => (
          <div key={s.id} className="flex flex-wrap items-center gap-1.5 rounded-lg border p-1.5" style={{ borderColor: "#DDE4EC" }}>
            <span className="text-xs font-bold text-slate-400 text-center shrink-0" style={{ width: 20 }}>{i + 1}</span>
            <input className={inp} style={{ ...inpStyle, flex: "1 1 170px" }} value={s.segmento} onChange={(e) => upSeg(s.id, { segmento: e.target.value })} />
            <input key={`${s.id}:${s.dur}`} className={inp} style={{ ...inpStyle, width: 70, flex: "0 0 auto", textAlign: "center" }} defaultValue={fmt(s.dur)} onBlur={(e) => { const v = parseDur(e.target.value); if (v == null || v < 0) { e.target.value = fmt(s.dur); } else upSeg(s.id, { dur: v }); }} />
            <select className={inp} style={{ ...inpStyle, width: 150, flex: "0 0 auto" }} value={s.fuente} onChange={(e) => upSeg(s.id, { fuente: e.target.value })}>
              {fuentes.map((f) => <option key={f.id} value={f.id}>{f.tipo === "cam" ? `${f.nombre} — ${trunc(f.plano, 18)}` : f.nombre}</option>)}
            </select>
            <span className="flex gap-0.5 shrink-0">
              <button className="text-slate-400" onClick={() => move(i, -1)} aria-label="Subir"><ChevronUp size={16} /></button>
              <button className="text-slate-400" onClick={() => move(i, 1)} aria-label="Bajar"><ChevronDown size={16} /></button>
              <button className="text-slate-400" onClick={() => delSeg(s.id)} aria-label="Eliminar segmento"><Trash2 size={16} /></button>
            </span>
          </div>
        ))}
        <button className={`${btn} text-white self-start`} style={{ background: NAVY }} onClick={addSeg}><Plus size={15} /> Agregar segmento</button>
      </Card>

      <Card title="Flujo de producción" open={false}>
        <label className="flex items-center gap-2 text-sm font-semibold" style={{ color: INK }}><input type="checkbox" checked={cfg.flujo.preview} onChange={(e) => up({ flujo: { ...cfg.flujo, preview: e.target.checked } })} /> Incluir monitor PREVIEW</label>
        <label className="flex items-center gap-2 text-sm font-semibold" style={{ color: INK }}><input type="checkbox" checked={cfg.flujo.playback} onChange={(e) => up({ flujo: { ...cfg.flujo, playback: e.target.checked } })} /> Incluir playback de comerciales / cortinillas</label>
        <p className="text-xs text-slate-500">Las cámaras del flujo y los monitores de cabina se generan automáticamente desde la sección de cámaras.</p>
      </Card>

      <Card title={`Personal de operación (${cfg.personal.length}${cfg.includeCamOps ? ` + ${cfg.camaras.length} cam.` : ""})`}>
        <div className="flex flex-wrap gap-1.5">
          {cfg.personal.map((p) => {
            const Ic = ICONS[p.icon] || User;
            return (
              <span key={p.id} className="flex items-center gap-1.5 rounded-full border pl-2 pr-1 py-1 text-xs font-semibold" style={{ borderColor: "#C8D2DE", color: INK }}>
                <Ic size={13} /> {p.rol}
                <button className="text-slate-400" onClick={() => delRol(p.id)} aria-label={`Quitar ${p.rol}`}><X size={13} /></button>
              </span>
            );
          })}
        </div>
        <div>
          <p className="text-xs font-bold uppercase text-slate-500 mb-1">Agregar rol común</p>
          <div className="flex flex-wrap gap-1.5">
            {CATALOGO_ROLES.filter((r) => !cfg.personal.some((p) => p.rol === r.rol)).map((r) => (
              <button key={r.rol} className="rounded-full border px-2.5 py-1 text-xs font-semibold" style={{ borderColor: "#C8D2DE", color: "#475569", background: "#F4F7FA" }} onClick={() => addRol(r.rol, r.icon)}>+ {r.rol}</button>
            ))}
          </div>
        </div>
        <div className="flex gap-2">
          <input className={inp} style={inpStyle} placeholder="Rol personalizado…" value={rolCustom} onChange={(e) => setRolCustom(e.target.value)} />
          <button className={`${btn} shrink-0`} style={{ background: "#E9EDF3", color: INK }} onClick={() => { if (rolCustom.trim()) { addRol(rolCustom.trim(), "custom"); setRolCustom(""); } }}><Plus size={15} /> Agregar</button>
        </div>
        <label className="flex items-center gap-2 text-sm font-semibold" style={{ color: INK }}><input type="checkbox" checked={cfg.includeCamOps} onChange={(e) => up({ includeCamOps: e.target.checked })} /> Incluir operadores de cámara automáticamente (uno por cámara)</label>
      </Card>
    </div>
  );
}

/* ----------------------------- App ----------------------------- */
function GeneradorInfografiaTV() {
  const [cfg, setCfg] = useState(DEMO);
  const [modo, setModo] = useState("vista");
  const [proyectos, setProyectos] = useState([]);
  const [cargado, setCargado] = useState(false);
  const [aviso, setAviso] = useState("");
  const st = window.storage;
  const S_AUTO = "tvprod:autosave", S_PROJ = "tvprod:proyectos";

  const flash = (msg) => { setAviso(msg); setTimeout(() => setAviso(""), 2600); };

  // Decodifica una config desde el hash del enlace (#p=...)
  const leerHash = () => {
    try {
      const h = window.location.hash || "";
      const m = h.match(/[#&]p=([^&]+)/);
      if (!m) return null;
      const c = JSON.parse(decodeURIComponent(m[1]));
      return c && c.camaras ? c : null;
    } catch { return null; }
  };

  useEffect(() => {
    (async () => {
      const compartido = leerHash();
      if (compartido) {
        setCfg(compartido);
        try { history.replaceState(null, "", window.location.pathname + window.location.search); } catch {}
        flash("Proyecto abierto desde un enlace compartido");
      } else {
        try { const r = await st.get(S_AUTO); if (r?.value) { const c = JSON.parse(r.value); if (c && c.camaras) setCfg(c); } } catch {}
      }
      try { const p = await st.get(S_PROJ); if (p?.value) setProyectos(JSON.parse(p.value)); } catch {}
      setCargado(true);
    })();
  }, []);

  useEffect(() => {
    if (!cargado) return;
    const t = setTimeout(async () => { try { await st.set(S_AUTO, JSON.stringify(cfg)); } catch {} }, 800);
    return () => clearTimeout(t);
  }, [cfg, cargado]);

  const persistProyectos = async (list) => { setProyectos(list); try { await st.set(S_PROJ, JSON.stringify(list)); } catch {} };
  const guardar = (nombre) => persistProyectos([...proyectos.filter((p) => p.nombre !== nombre), { id: uid(), nombre, fecha: new Date().toISOString(), cfg }]);
  const cargar = (p) => { setCfg(p.cfg); setModo("vista"); };
  const eliminar = (p) => persistProyectos(proyectos.filter((x) => x.id !== p.id));

  // Exportar el proyecto actual como archivo .json
  const exportar = () => {
    const nombre = (cfg.titulo || "proyecto").replace(/[^\w\sáéíóúñ-]/gi, "").trim().slice(0, 40) || "proyecto";
    const blob = new Blob([JSON.stringify(cfg, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${nombre}.tvprod.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    flash("Archivo descargado — compártelo con tu equipo");
  };

  // Importar un proyecto desde archivo .json
  const importar = (file) => {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const c = JSON.parse(r.result);
        if (c && c.camaras && c.escaleta) { setCfg(c); setModo("vista"); flash("Proyecto importado correctamente"); }
        else flash("El archivo no es un proyecto válido");
      } catch { flash("No se pudo leer el archivo"); }
    };
    r.readAsText(file);
  };

  // Copiar un enlace que abre este proyecto ya cargado
  const compartirEnlace = async () => {
    const base = window.location.href.split("#")[0];
    const url = base + "#p=" + encodeURIComponent(JSON.stringify(cfg));
    try {
      await navigator.clipboard.writeText(url);
      flash(url.length > 8000 ? "Enlace copiado (es largo: mejor comparte el archivo .json)" : "Enlace copiado al portapapeles");
    } catch {
      window.prompt("Copia este enlace para compartir el proyecto:", url);
    }
  };

  const imprimir = () => { if (modo !== "vista") { setModo("vista"); setTimeout(() => window.print(), 400); } else window.print(); };

  const tab = (m, Icono, label) => (
    <button onClick={() => setModo(m)} className="flex items-center gap-1.5 rounded-md px-3 py-1.5 text-sm font-bold" style={modo === m ? { background: "#fff", color: NAVY } : { background: "transparent", color: "#C6D4E6" }}>
      <Icono size={15} /> {label}
    </button>
  );

  return (
    <div className="min-h-screen" style={{ background: "#E4E9F0", fontFamily: "'Barlow', system-ui, sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600;700;800&display=swap');
        .cond { font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; }
        details > summary::-webkit-details-marker { display: none; }
        @media print {
          .no-print { display: none !important; }
          .scrollwrap { overflow: visible !important; padding: 0 !important; }
          .print-zoom { zoom: 0.6; }
          body { background: #fff; }
          @page { size: A4 landscape; margin: 6mm; }
        }
      `}</style>

      <div className="no-print sticky top-0 z-10 flex flex-wrap items-center gap-2 px-3 py-2 shadow" style={{ background: NAVY }}>
        <Clapperboard size={18} color="#fff" />
        <span className="cond font-bold uppercase text-white" style={{ fontSize: 16, letterSpacing: 1 }}>Generador de infografías de producción TV</span>
        <span className="flex-1" />
        <div className="flex gap-1 rounded-lg p-1" style={{ background: "rgba(255,255,255,.12)" }}>
          {tab("editar", Pencil, "Editar")}
          {tab("vista", Eye, "Infografía")}
        </div>
        <button onClick={compartirEnlace} className="flex items-center gap-1.5 rounded-md px-3 py-1.5 text-sm font-bold" style={{ background: "rgba(255,255,255,.16)", color: "#fff" }}><Share2 size={15} /> Compartir</button>
        <button onClick={imprimir} className="flex items-center gap-1.5 rounded-md px-3 py-1.5 text-sm font-bold text-white" style={{ background: AIR_COLOR }}><Printer size={15} /> Imprimir / PDF</button>
      </div>

      {aviso && (
        <div className="no-print fixed left-1/2 z-20 flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-semibold text-white shadow-lg"
          style={{ top: 56, transform: "translateX(-50%)", background: "#1FA14E" }}>
          <Check size={16} /> {aviso}
        </div>
      )}

      {modo === "editar" ? (
        <Editor cfg={cfg} setCfg={setCfg} proyectos={proyectos} guardar={guardar} cargar={cargar} eliminar={eliminar} exportar={exportar} importar={importar} compartirEnlace={compartirEnlace} />
      ) : (
        <div className="scrollwrap overflow-auto px-2 py-4">
          <div className="print-zoom"><Infografia cfg={cfg} /></div>
          <p className="no-print text-center text-xs text-slate-500 mt-3">En pantallas pequeñas desliza horizontalmente. “Imprimir / PDF” exporta en horizontal; ajusta la escala en el diálogo si lo necesitas.</p>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GeneradorInfografiaTV />);
</script>
</body>
</html>
